name: Set up build environment
description: Prepare the locked Windows build environment.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
        architecture: x64
        cache: pip
        cache-dependency-path: requirements-build.lock.txt
    - name: Create build environment
      shell: pwsh
      run: |
        python -m venv .venv
        $pythonSignature = .venv\Scripts\python.exe -c "import sys; print(sys.version, sys.base_prefix)"
        "PYO3_ENVIRONMENT_SIGNATURE=$pythonSignature" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        .venv\Scripts\python.exe -m pip install -r requirements-build.lock.txt
    - name: Check dependencies
      shell: pwsh
      run: .venv\Scripts\python.exe -m pip check
